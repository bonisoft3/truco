types:
  types:
    string:
      pg: text
      column: plain
      subset: true
      base:
        - text
        - varchar
        - bpchar
        - tsvector
      json: string
      refuse: \x00
      order: text
      beyond:
        - scalar-values
    bool:
      pg: boolean
      column: plain
      subset: true
      base:
        - bool
        - boolean
      json: boolean
      order: boolean
      beyond: []
    int32:
      pg: integer
      column: plain
      subset: true
      base:
        - int2
        - int4
        - integer
        - smallint
      json: number
      min: -2147483648
      max: 2147483647
      order: number
      beyond: []
    int64:
      pg: bigint
      column: domain
      subset: false
      sql: portable_int64
      base:
        - int8
        - bigint
      json: string
      pattern: '^(0|-?[1-9][0-9]*)$'
      order: integer
      beyond:
        - int64-range
    double:
      pg: double precision
      column: checked
      subset: true
      base:
        - float4
        - float8
        - double precision
        - real
      json: number
      order: number
      beyond: []
    bytes:
      pg: bytea
      column: domain
      subset: false
      sql: portable_bytes
      base:
        - bytea
      json: string
      pattern: '^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
      order: none
      beyond: []
    uuid:
      pg: uuid
      column: plain
      subset: true
      base:
        - uuid
      json: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      order: text
      beyond: []
    timestamp:
      pg: timestamptz
      column: domain
      subset: false
      sql: portable_timestamp
      base:
        - timestamptz
        - timestamp with time zone
      json: string
      pattern: '^(000[1-9]|00[1-9][0-9]|0[1-9][0-9]{2}|[1-9][0-9]{3})-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\.[0-9]{6}Z$'
      order: text
      beyond:
        - calendar
    duration:
      pg: interval
      column: domain
      subset: false
      sql: portable_duration
      base:
        - interval
      json: string
      pattern: '^PT(0|[1-9][0-9]*)(\.[0-9]{0,5}[1-9])?S$'
      order: duration
      beyond:
        - duration-range
    decimal:
      pg: numeric
      column: domain
      subset: false
      base:
        - numeric
        - decimal
      json: string
      pattern: '^(0|-?[1-9][0-9]*|-?(0|[1-9][0-9]*)\.[0-9]*[1-9])$'
      order: decimal
      beyond:
        - decimal-profile
    date:
      pg: date
      column: checked
      subset: true
      base:
        - date
      json: string
      pattern: '^(000[1-9]|00[1-9][0-9]|0[1-9][0-9]{2}|[1-9][0-9]{3})-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
      order: text
      beyond:
        - calendar
    time:
      pg: time(6)
      column: domain
      subset: false
      sql: portable_time
      base:
        - time
        - time without time zone
      json: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\.[0-9]{6}$'
      order: text
      beyond: []
    timezone:
      pg: text
      column: checked
      subset: true
      base:
        - text
      json: string
      pattern: '^[A-Za-z0-9+_/-]+$'
      order: none
      beyond:
        - tzdb
    json:
      pg: json
      column: checked
      subset: false
      base:
        - json
        - jsonb
      json: value
      order: none
      beyond:
        - scalar-values
        - finite-numbers
    geojson:
      pg: json
      column: checked
      subset: false
      base:
        - json
        - jsonb
        - geometry
        - geography
      json: value
      order: none
      beyond:
        - scalar-values
        - finite-numbers
        - ring-closure
  aliases:
    text: string
    int: int32
    bigint: int64
    timestamptz: timestamp
    tsvector: string
