# generated by pronto from program.cue — do not edit
say:
  self:
    version: v0.42.2
  doctor:
    do: 'use tools.nu [run-mise]; run-mise exec -- cue version; run-mise exec -- deno --version; run-mise where github:bonisoft3/pronto'
  generate:
    rulemap:
      auto-bayt:
        priority: 2
        cmds:
          - use: ./auto-bayt.nu
            do: auto-bayt
      auto-cue:
        cmds:
          - use: ./tools.nu
            do: tools run-cue cmd generate ./pronto
      omnishell:
        priority: 0
        cmds:
          - do: 'if (''program.cue'' | path exists) { use tools.nu [run-mise]; run-mise exec -- omnishell mode . | save --force program_terminal.cue }'
      pronto:
        priority: 1
        cmds:
          - do: |-
              if ('program.cue' | path exists) { let pkg = (open program.cue --raw | parse -r '(?m)^package\s+(\w+)\s*$' | first | get capture0); $'package ($pkg)
              loop: surface: sources: pronto: ""
              ' | save --force program_pronto.cue; use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read --allow-write=. --allow-run --allow-env ($pronto | path join write.ts) . }
  build:
    do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read --allow-write=. --allow-run --allow-env ($pronto | path join write.ts) .'
  integrate:
    rulemap:
      builtin:
        stop: false
      acceptance:
        cmds:
          - do: mise exec -- docker compose -p (^mise exec -- printenv COMPOSE_PROJECT_NAME | complete | get stdout | str trim | str replace -r '^$' 'truco') --profile '*' -f .bayt/compose.check-acceptance.closure.yaml up bayt --abort-on-container-failure --exit-code-from bayt --build --remove-orphans --attach-dependencies
      fit:
        cmds:
          - do: mise exec -- docker compose -p (^mise exec -- printenv COMPOSE_PROJECT_NAME | complete | get stdout | str trim | str replace -r '^$' 'truco') --profile '*' -f .bayt/compose.check-fit.closure.yaml up bayt --abort-on-container-failure --exit-code-from bayt --build --remove-orphans --attach-dependencies
      window:
        cmds:
          - do: mise exec -- docker compose -p (^mise exec -- printenv COMPOSE_PROJECT_NAME | complete | get stdout | str trim | str replace -r '^$' 'truco') --profile '*' -f .bayt/compose.check-window.closure.yaml up bayt --abort-on-container-failure --exit-code-from bayt --build --remove-orphans --attach-dependencies
      visual:
        cmds:
          - do: mise exec -- docker compose -p (^mise exec -- printenv COMPOSE_PROJECT_NAME | complete | get stdout | str trim | str replace -r '^$' 'truco') up -d --wait --build launch
          - do: mise exec -- docker compose -p (^mise exec -- printenv COMPOSE_PROJECT_NAME | complete | get stdout | str trim | str replace -r '^$' 'truco') --profile '*' -f .bayt/compose.integrate.closure.yaml up bayt --abort-on-container-failure --exit-code-from bayt --build --remove-orphans --attach-dependencies
  launch:
    rulemap:
      builtin:
        cmds:
          - do: 'if not (''.certs/localhost.pem'' | path exists) { mkdir .certs; mise exec -- mkcert -cert-file .certs/localhost.pem -key-file .certs/localhost-key.pem localhost 127.0.0.1 ::1 }'
          - do: launch
            use: ./launch.nu
  lint:
    rulemap:
      cue:
        cmds:
          - do: mise exec -- cue vet ./...
      facts:
        priority: 1
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read --allow-run --allow-env ($pronto | path join check-facts.ts) .'
      sql:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read --allow-run --allow-env ($pronto | path join check-sql.ts) .'
      caddy:
        cmds:
          - do: 'with-env {ELECTRIC_SECRET: lint, ORIGIN: lint} { mise exec -- caddy adapt --config docker/Caddyfile --adapter caddyfile out> (if $nu.os-info.name == "windows" { "NUL" } else { "/dev/null" }) }'
      handlers:
        cmds:
          - do: 'use tools.nu [run-mise]; run-mise exec -- omnishell check handlers .'
      markup:
        cmds:
          - do: 'use tools.nu [run-mise]; run-mise exec -- omnishell check markup .'
      derive:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read=. ($pronto | path join derive.ts) --self-test'
      types:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); let files = do { cd $pronto; [ ...(glob --no-dir --exclude [*_test.ts *.test.ts] ''*.ts'') ...(glob --no-dir ''scales/*.ts'') ] }; run-mise exec -- deno check --config ($pronto | path join deno.json) ...$files'
      proto:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run --config ($pronto | path join deno.json) --allow-read --allow-run --allow-env ($pronto | path join check-proto.ts) .'
  release:
    rulemap:
      pages:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run -A --config ($pronto | path join bundle deno.json) ($pronto | path join bundle bundle.ts) . --omnishell (run-mise where github:bonisoft3/omnishell | str trim) --mecha (run-mise where github:bonisoft3/mecha | str trim) --out dist/browser --base ($env.SAY_RELEASE_ARGS_BASE? | default "")'
          - do: 'if ($env.SAY_RELEASE_ARGS_SNAPSHOT? | is-empty) { release --skip=validate --clean } else { release --snapshot --skip=validate --clean }'
            use: ./release.nu
          - do: 'if ($env.SAY_RELEASE_ARGS_SNAPSHOT? | is-empty) { use semver.nu [tag-on-head]; let tag = (tag-on-head); if ($tag | is-empty) { error make {msg: "no release tag on HEAD to push"} }; git push origin $tag }'
        platform: pages
      cloudflare:
        cmds:
          - do: 'use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run -A --config ($pronto | path join bundle deno.json) ($pronto | path join bundle cloudflare.ts) . --omnishell (run-mise where github:bonisoft3/omnishell | str trim) --mecha (run-mise where github:bonisoft3/mecha | str trim) --out dist/cloudflare --domain truco.bonisoft3.com'
          - do: 'if ($env.SAY_RELEASE_ARGS_SNAPSHOT? | is-empty) { release --skip=validate --clean } else { release --snapshot --skip=validate --clean }'
            use: ./release.nu
          - do: 'if ($env.SAY_RELEASE_ARGS_SNAPSHOT? | is-empty) { npx wrangler deploy --config dist/cloudflare/wrangler.jsonc }'
        platform: cloudflare
  setup:
    rulemap:
      builtin:
        cmds:
          - do: setup
            use: ./setup.nu
          - do: mkdir .certs
          - do: 'mise exec -- mkcert -cert-file .certs/localhost.pem -key-file .certs/localhost-key.pem localhost 127.0.0.1 ::1'
          - do: 'print ''the browser trusts this certificate only once you run: mise exec -- mkcert -install'''
  test:
    rulemap:
      builtin:
        stop: false
        cmds:
          - do: test
            use: ./test.nu
      arena:
        cmds:
          - do: deno test --config tests/deno.json --no-lock --no-check --allow-env --allow-read tests/arena.test.ts
      fuel_mutations:
        cmds:
          - do: deno test --config tests/deno.json --no-lock --no-check --allow-env --allow-read tests/fuel_mutations_storybook.test.ts
      lobby_presence:
        cmds:
          - do: deno test --config tests/deno.json --no-lock --no-check --allow-env --allow-read tests/lobby_presence.test.ts
      machines:
        cmds:
          - do: 'use tools.nu [run-mise]; run-mise exec -- omnishell check machines .'
      i18n:
        cmds:
          - do: 'use tools.nu [run-mise]; run-mise exec -- omnishell check i18n .'
      battery:
        cmds:
          - do: 'use tools.nu [run-mise]; run-mise exec -- omnishell check battery .'
