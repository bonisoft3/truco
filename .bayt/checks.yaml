# generated from bayt.cue — do not edit
say:
  integrate:
    rulemap:
      builtin:
        stop: false
      replay:
        priority: 1
        cmds:
        - do: use integrate.nu; integrate --bake --no-up --with-buildx --target ci-replay
      pronto-integrate-0:
        priority: 0
        cmds:
        - do: >-
            use integrate.nu; integrate --bake --no-up --with-buildx --target
            ci-acceptance,ci-fit,ci-window
      visual:
        cmds:
        - do: use integrate.nu; integrate --bake --no-up --with-buildx --target ci-visual
  launch:
    rulemap:
      builtin:
        cmds:
        - do: >-
            if not ('.certs/localhost.pem' | path exists) { mkdir .certs; mise exec --
            mkcert -cert-file .certs/localhost.pem -key-file .certs/localhost-key.pem localhost
            127.0.0.1 ::1 }
        - do: launch
          use: ./launch.nu
  lint:
    rulemap:
      cue:
        cmds:
        - do: mise exec -- cue vet -c ./...
      facts:
        priority: 1
        cmds:
        - do: >-
            use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto |
            str trim); run-mise exec -- deno run --config ($pronto | path join deno.json)
            --allow-read --allow-run --allow-env ($pronto | path join check-facts.ts) .
      sql:
        cmds:
        - do: >-
            use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto |
            str trim); run-mise exec -- deno run --config ($pronto | path join deno.json)
            --allow-read --allow-run --allow-env ($pronto | path join check-sql.ts) .
      identity:
        cmds:
        - do: >-
            use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto |
            str trim); run-mise exec -- deno run --config ($pronto | path join deno.json)
            --allow-read --allow-run --allow-env ($pronto | path join identity.ts) check .
      hybrids:
        cmds:
        - do: >-
            use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto |
            str trim); run-mise exec -- deno run --config ($pronto | path join deno.json)
            --allow-read ($pronto | path join check-hybrids.ts) .
      caddy:
        cmds:
        - do: "with-env {ELECTRIC_SECRET: lint, ORIGIN: lint} { mise exec -- caddy adapt --config docker/Caddyfile --adapter caddyfile out> (if $nu.os-info.name == \"windows\" { \"NUL\" } else { \"/dev/null\" }) }"
      handlers:
        cmds:
        - do: use tools.nu [run-mise]; run-mise exec -- omnishell check handlers .
      markup:
        cmds:
        - do: use tools.nu [run-mise]; run-mise exec -- omnishell check markup .
      derive:
        cmds:
        - do: >-
            use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto |
            str trim); run-mise exec -- deno run --config ($pronto | path join deno.json)
            --allow-read=. ($pronto | path join derive.ts) --self-test
      types:
        cmds:
        - do: >-
            use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto |
            str trim); let files = do { cd $pronto; [ ...(glob --no-dir --exclude [*_test.ts
            *.test.ts hybrid-local.ts hybrid-battery.ts] '*.ts') ...(glob --no-dir
            'scales/*.ts') ] }; run-mise exec -- deno check --config ($pronto | path join deno.json)
            ...$files
      proto:
        cmds:
        - do: >-
            use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto |
            str trim); run-mise exec -- deno run --config ($pronto | path join deno.json)
            --allow-read --allow-run --allow-env ($pronto | path join check-proto.ts) .
  release:
    rulemap:
      pages:
        cmds:
        - do: >-
            use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto |
            str trim); run-mise exec -- deno run -A --config ($pronto | path join bundle
            deno.json) ($pronto | path join bundle bundle.ts) . --omnishell (run-mise where
            github:bonisoft3/omnishell | str trim) --mecha (run-mise where github:bonisoft3/mecha
            | str trim) --out dist/browser --base ($env.SAY_RELEASE_ARGS_BASE? | default "")
        - do: >-
            if ($env.SAY_RELEASE_ARGS_SNAPSHOT? | is-empty) { release --skip=validate
            --clean } else { release --snapshot --skip=validate --clean }
          use: ./release.nu
        - do: "if ($env.SAY_RELEASE_ARGS_SNAPSHOT? | is-empty) { use semver.nu [tag-on-head]; let tag = (tag-on-head); if ($tag | is-empty) { error make {msg: \"no release tag on HEAD to push\"} }; git push origin $tag }"
        platform: pages
      cloudflare:
        cmds:
        - do: >-
            use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto |
            str trim); let data = if ($env.SAY_RELEASE_ARGS_FROM? | is-not-empty) {
            ['--from' $env.SAY_RELEASE_ARGS_FROM] } else { [] }; run-mise exec -- deno run -A
            --config ($pronto | path join bundle deno.json) ($pronto | path join bundle edge.ts) .
            --omnishell (run-mise where github:bonisoft3/omnishell | str trim) --mecha
            (run-mise where github:bonisoft3/mecha | str trim) --out dist/cloudflare ...$data
            --domain truco.bonisoft3.com
        - do: >-
            if ($env.SAY_RELEASE_ARGS_SNAPSHOT? | is-empty) { release --skip=validate
            --clean } else { release --snapshot --skip=validate --clean }
          use: ./release.nu
        - do: >-
            if ($env.SAY_RELEASE_ARGS_SNAPSHOT? | is-empty) { use tools.nu [run-mise]; let
            pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec --
            deno run -A --config ($pronto | path join bundle deno.json) ($pronto | path join
            bundle publish-edge.ts) dist/cloudflare --mecha (run-mise where
            github:bonisoft3/mecha | str trim) ...(if ($env.SAY_RELEASE_ARGS_RESET? | is-empty) { [] } else {
            ['--reset'] }) }
        platform: cloudflare
      docker:
        cmds:
        - do: docker compose build release-docker
        - do: >-
            if ($env.SAY_RELEASE_ARGS_SNAPSHOT? | is-empty) { release --skip=validate
            --clean } else { release --snapshot --skip=validate --clean }
          use: ./release.nu
        - do: "if ($env.SAY_RELEASE_ARGS_SNAPSHOT? | is-empty) { use semver.nu [tag-on-head]; let tag = (tag-on-head); if ($tag | is-empty) { error make {msg: \"no release tag on HEAD to push\"} }; git push origin $tag; let image_tag = ($tag | path basename); with-env { BAYT_IMAGE_TAG: $image_tag } { docker compose build release-docker; docker compose push release-docker } }"
        platform: docker
      k8s:
        platform: k8s
        cmds:
        - do: >-
            use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto |
            str trim); nu ($pronto | path join k8s release.nu)
  self:
    version: v0.44.2
  doctor:
    do: >-
      use tools.nu [run-mise]; run-mise exec -- cue version; run-mise exec -- deno
      --version; run-mise where github:bonisoft3/pronto
  build:
    do: "null"
  generate:
    rulemap:
      omnishell:
        priority: 0
        cmds:
        - do: >-
            if ('program.cue' | path exists) { use tools.nu [run-mise]; run-mise exec --
            omnishell mode . | save --force program_terminal.cue }
      auto-cue:
        cmds:
        - use: ./tools.nu
          do: >-
            if ('pronto/generate_tool.cue' | path exists) { tools run-cue cmd generate
            ./pronto }
      pronto:
        priority: 1
        cmds:
        - do: >-
            if ('program.cue' | path exists) { use tools.nu [run-mise]; let pronto =
            (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run --config
            ($pronto | path join deno.json) --allow-read --allow-write=. --allow-run
            --allow-env ($pronto | path join write.ts) . }
      auto-bayt:
        priority: 2
        cmds:
        - use: ./auto-bayt.nu
          do: auto-bayt
  setup:
    rulemap:
      builtin:
        cmds:
        - do: setup
          use: ./setup.nu
        - do: mkdir .certs
        - do: >-
            mise exec -- mkcert -cert-file .certs/localhost.pem -key-file
            .certs/localhost-key.pem localhost 127.0.0.1 ::1
        - do: "print 'the browser trusts this certificate only once you run: mise exec -- mkcert -install'"
  test:
    rulemap:
      builtin:
        stop: false
        cmds:
        - do: test
          use: ./test.nu
      arena:
        cmds:
        - do: >-
            deno test --config tests/deno.json --no-lock --no-check --allow-env
            --allow-read tests/arena.test.ts
      fuel_mutations:
        cmds:
        - do: >-
            deno test --config tests/deno.json --no-lock --no-check --allow-env
            --allow-read tests/fuel_mutations_storybook.test.ts
      online_machine:
        cmds:
        - do: >-
            deno test --config tests/online-deno.json --no-lock --allow-env --allow-read
            --allow-run=cue tests/online-machine.test.ts tests/lobby-machine.test.ts
        - do: >-
            deno test --config tests/online-deno.json --no-lock --no-check --allow-env
            --allow-read --allow-run=cue tests/online-screens.test.ts
      machines:
        cmds:
        - do: use tools.nu [run-mise]; run-mise exec -- omnishell check machines .
      i18n:
        cmds:
        - do: use tools.nu [run-mise]; run-mise exec -- omnishell check i18n .
      battery:
        cmds:
        - do: use tools.nu [run-mise]; run-mise exec -- omnishell check battery .
