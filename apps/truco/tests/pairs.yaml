# generated by pronto from program.cue — do not edit
pairs:
  - id: test-deal-shuffle
    ir: test-deal-shuffle
    of: Round
    accepts:
      - accept-fresh-shuffle
      - accept-instant-table
    says: 'a deal takes forty distinct cards, three to each seat and one vira, and two deals differ'
    given:
      deck: 40
      seats: 2
      hand: 3
    when: deal
    then: 'output.deck == 40 && output.hands.all(h, h == input.hand) && output.dealtDistinct && output.first != output.second'
  - id: test-paulista-manilha
    ir: test-paulista-manilha
